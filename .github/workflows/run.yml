name: GitHub Trending Monitor

on:
  schedule:
    - cron: '0 9 * * *'  # codziennie o 9:00 UTC
  workflow_dispatch:      # mozna tez uruchomic recznie

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Run monitor
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python github_monitor.py

      - name: Save state
        run: |
          git config user.email bot@gh.com
          git config user.name Bot
          git add seen_repos.json
          git diff --staged --quiet || git commit -m "Update seen repos"
          git push
